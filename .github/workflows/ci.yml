name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'dev/**'

permissions:
  contents: read

jobs:
  backend-and-frontend:
    name: Go and frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend test
      # Go embeds web/dist, which is produced by the frontend build.
      - run: npm --prefix frontend run build
      - run: go vet ./...
      - run: go test ./...

  cli:
    name: CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            cli/package-lock.json
            cli/packages/ink/package-lock.json
      - run: npm ci --prefix cli/packages/ink
      - run: npm ci --prefix cli
      - run: npm --prefix cli run build
      - run: npm --prefix cli test
